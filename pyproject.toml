[project]
name = "cadenzra"
version = "0.1.0"
description = "AI music composition: correct sheet music first, audio derived from it."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "mido>=1.3.3",
    "langgraph>=1.2.10",
]

[project.scripts]
cadenzra = "cadenzra.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.mypy]
strict = true
files = ["src", "tests"]

# mido ships no py.typed marker. Narrow to that package so a genuinely
# untyped import elsewhere still fails the build.
[[tool.mypy.overrides]]
module = ["mido", "mido.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the real lilypond/fluidsynth binaries",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
